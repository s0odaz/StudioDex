            <div style={{ display:'flex', gap:'8px' }}>
              <button onClick={()=>setCode(lesson.code)} style={{ background:'none', border:'1px solid #2a2d35', color:'#888', padding:'4px 12px', borderRadius:'6px', fontSize:'12px', cursor:'pointer' }}>Reset</button>
              <button onClick={()=>setLogs(simulateRun(code))} className="btn-primary" style={{ padding:'6px 16px', fontSize:'13px', display:'flex', alignItems:'center', gap:'6px' }}>
                {Icons.play} Run

            </div>

          <CodeEditor value={code} onChange={setCode} height="calc(100vh - 420px)" />
          <Console logs={logs} onClear={()=>setLogs([])} />

      </div>
    </div>
  );
}

  const [submitted, setSubmitted] = useState(false);
  const [stdout, setStdout] = useState([]);
  const [errors, setErrors] = useState([]);
  const tcs = (challenge && CHALLENGE_TESTCASES[challenge.id]) || [{ label:'Case 1', input:'', expected:'' }];
  const [tcIdx, setTcIdx] = useState(0);

  if (!challenge) return <div style={{ padding:'40px' }}>No challenge selected. <button onClick={()=>setPage('challenges')} style={{ color:'#00D4FF', background:'none', border:'none', cursor:'pointer' }}>Back</button></div>;

  const diffClass = challenge.difficulty === 'Beginner' ? 'diff-easy' : challenge.difficulty === 'Intermediate' ? 'diff-medium' : 'diff-hard';

  const runCode = () => {
    const out = [], errs = [];
    runLuauCode(code, (type, text) => { if (type === 'error') errs.push(text); else out.push(text); });

    setPassed(false);

    setBottomTab(errs.length > 0 ? 'compilation' : 'results');

    setSubmitted(true);
    const { out, errs } = runCode();
    setBottomTab(errs.length > 0 ? 'compilation' : 'results');

    const ok = errs.length === 0 && checkOutput(out, tc0?.expected || '');
    setPassed(ok);

function PlaygroundPage() {
  const starter = `-- 🧪 Luau Sandbox — Write anything!\n-- This is a simulated environment\n\nlocal message = "Hello from StudioDex!"\nprint(message)\n\n-- Try using math, string, table...\nlocal nums = {10, 3, 7, 1, 9, 4}\ntable.sort(nums)\nprint("Sorted:", table.concat(nums, ", "))\n\n-- String formatting\nlocal xp = 1250\nprint(string.format("Current XP: %d | Level: %d", xp, math.floor(xp/100)))\n\n-- math operations\nprint("Pi:", math.pi)\nprint("Random:", math.random(1, 100))\nprint("Clamp:", math.clamp(150, 0, 100))`;
  const [code, setCode] = useState(starter);
  const [logs, setLogs] = useState([]);
  const [copied, setCopied] = useState(false);
  const snippets = [

  const xp = currentUser?.xp ?? 1250;

  const maxXp = level * 200;

        <div>
          <div style={{ display:'flex', gap:'12px', alignItems:'center', flexWrap:'wrap', marginBottom:'4px' }}>

            {isPro

            }

function LeaderboardPage() {
  const { currentUser } = useAuth();
  const userXp = currentUser?.xp ?? 0;
  const userStreak = currentUser?.streak ?? 0;
  const isPro = currentUser?.isPro ?? false;
  const [lbTab, setLbTab] = useState('Weekly');

  const mulForTab = { Weekly: 1, Monthly: 4.2, 'All Time': 52 };
  const xpMulForTab = { Weekly: 1, Monthly: 3.2, 'All Time': 17.5 };
  const xpDecForTab = { Weekly: 0, Monthly: 0.08, 'All Time': 0.45 };

  const getData = () => {
    const mul = mulForTab[lbTab];
    const xpMul = xpMulForTab[lbTab];
    const xpDec = xpDecForTab[lbTab];
    const baseList = LEADERBOARD.map((p, i) => ({
      ...p,
      xp: lbTab === 'Weekly' ? p.xp : Math.round(p.xp * (xpMul - i * xpDec)),
      streak: lbTab === 'Weekly' ? p.streak : Math.round(p.streak * mul),
    }));

    if (currentUser) {
      const uXP = lbTab === 'Weekly' ? (userXp || 0)
        : lbTab === 'Monthly' ? Math.round((userXp || 0) * 4)
        : Math.round((userXp || 0) * 48);
      const uStreak = lbTab === 'Weekly' ? (userStreak || 0)
        : lbTab === 'Monthly' ? Math.round((userStreak || 0) * 4)
        : Math.round((userStreak || 0) * 48);
      const userEntry = {
        name: currentUser,
        xp: uXP,
        streak: uStreak,
        level: Math.max(1, Math.floor((userXp || 0) / 500) + 1),
        badge: isPro ? 'Pro' : 'Learner',
        avatar: '🧑‍💻',
        isPro,
        isUser: true,
      };
      const withUser = [...baseList, userEntry]
        .sort((a, b) => b.xp - a.xp)
        .map((p, i) => ({ ...p, rank: i + 1 }));
      return withUser;
    }
    return baseList;
  };

  const data = getData();
  const userEntry = data.find(p => p.isUser);
  const subtitles = {
    Weekly: 'Top XP earners this week.',
    Monthly: 'Top XP earners this month.',
    'All Time': 'All-time XP hall of fame.',
  };

  return (
    <div style={{ padding:'32px', maxWidth:'700px' }}>
      <h1 className="oxanium" style={{ fontSize:'32px', fontWeight:'800', marginBottom:'8px' }}>🏆 Leaderboard</h1>
      <p style={{ color:'#888', marginBottom:'28px' }}>{subtitles[lbTab]} Keep grinding!</p>
      <div style={{ display:'flex', gap:'8px', marginBottom:'28px' }}>
        {['Weekly','Monthly','All Time'].map(t => (
          <button key={t} onClick={()=>setLbTab(t)} style={{
            padding:'6px 20px', borderRadius:'999px', cursor:'pointer', fontSize:'13px',
            fontFamily:"'Rajdhani',sans-serif", fontWeight:'700', transition:'all 0.15s',
            background: t===lbTab ? 'rgba(0,212,255,0.15)' : '#111216',
            color: t===lbTab ? '#00D4FF' : '#888',
            border: `1px solid ${t===lbTab ? 'rgba(0,212,255,0.4)' : '#1e2028'}`,
          }}>{t}</button>
        ))}
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
        {data.slice(0, 10).map(p => (
          <div key={p.rank} style={{
            background: p.isUser ? 'rgba(0,212,255,0.08)' : p.rank===1?'rgba(234,179,8,0.08)':p.rank===2?'rgba(148,163,184,0.05)':p.rank===3?'rgba(205,127,50,0.05)':'#111216',
            border:`1px solid ${p.isUser?'rgba(0,212,255,0.35)':p.rank===1?'rgba(234,179,8,0.3)':p.rank===2?'rgba(148,163,184,0.2)':p.rank===3?'rgba(205,127,50,0.2)':'#1e2028'}`,
            borderRadius:'12px', padding:'16px 20px', display:'flex', alignItems:'center', gap:'16px'
          }}>
            <div className="oxanium" style={{ fontSize:'22px', fontWeight:'800', width:'40px', color:p.rank===1?'#eab308':p.rank===2?'#94a3b8':p.rank===3?'#cd7f32':'#888' }}>
              {p.rank===1?'🥇':p.rank===2?'🥈':p.rank===3?'🥉':`#${p.rank}`}
            </div>
            <div style={{ fontSize:'30px' }}>{p.avatar}</div>
            <div style={{ flex:1 }}>
              <div style={{ fontWeight:'700', fontSize:'15px', marginBottom:'3px', display:'flex', alignItems:'center', gap:'6px' }}>
                {p.name}
                {p.isUser && <span style={{ fontSize:'10px', padding:'2px 6px', borderRadius:'4px', background:'rgba(0,212,255,0.15)', color:'#00D4FF', fontWeight:'700' }}>YOU</span>}

              </div>
              <div style={{ fontSize:'12px', color:'#888' }}>Level {p.level} · {p.badge} · 🔥 {p.streak.toLocaleString()} streak</div>
            </div>
            <div style={{ textAlign:'right' }}>
              <div className="oxanium" style={{ fontSize:'20px', fontWeight:'800', color: p.isUser?'#00D4FF':'#00D4FF' }}>{p.xp.toLocaleString()}</div>
              <div style={{ fontSize:'11px', color:'#888' }}>XP</div>
            </div>
          </div>
        ))}
      </div>

      <div style={{ background: userEntry ? 'rgba(0,212,255,0.05)' : 'rgba(0,212,255,0.03)', border:'1px solid rgba(0,212,255,0.15)', borderRadius:'12px', padding:'20px', marginTop:'24px', textAlign:'center' }}>
        {userEntry ? (

}

function AuthPage({ mode, setPage }) {
  const { setCurrentUser } = useAuth();
  const [form, setForm] = useState({ email:'', password:'', username:'' });
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const [step, setStep] = useState('form'); // 'form' | 'verify'
  const [verifyCode, setVerifyCode] = useState('');
  const [digits, setDigits] = useState(['','','','','','']);
  const dr0=useRef(), dr1=useRef(), dr2=useRef(), dr3=useRef(), dr4=useRef(), dr5=useRef();
  const digitRefs = [dr0,dr1,dr2,dr3,dr4,dr5];

  const handleDigit = (i, val) => {
    const v = val.replace(/\D/g,'').slice(-1);
    const next = [...digits]; next[i] = v; setDigits(next);
    setErr('');
    if (v && i < 5) digitRefs[i+1].current?.focus();
  };

  const handleDigitKey = (i, e) => {
    if (e.key === 'Backspace') {
      if (!digits[i] && i > 0) { const next=[...digits]; next[i-1]=''; setDigits(next); digitRefs[i-1].current?.focus(); }
      else { const next=[...digits]; next[i]=''; setDigits(next); }
    }
    if (e.key === 'Enter') handleVerify();
  };

  const handleSubmit = () => {
    setErr('');
    if (mode === 'signup') {
      if (!form.username.trim()) return setErr('Please enter a username');
      if (!form.email.trim()) return setErr('Please enter your email');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) return setErr('Please enter a valid email address');
      if (form.password.length < 6) return setErr('Password must be at least 6 characters');
      const users = _getUsers();
      if (users.find(u => u.email === form.email.trim().toLowerCase())) return setErr('Email already registered');
      if (users.find(u => u.username.toLowerCase() === form.username.trim().toLowerCase())) return setErr('Username already taken');
      const code = String(Math.floor(100000 + Math.random() * 900000));
      setVerifyCode(code);
      setDigits(['','','','','','']);
      setStep('verify');
    } else {
      if (!form.email.trim()) return setErr('Please enter your email');
      if (!form.password) return setErr('Please enter your password');
      setLoading(true);
      setTimeout(() => {
        const result = authLogin(form.email.trim().toLowerCase(), form.password);
        setLoading(false);
        if (result.error) { setErr(result.error); return; }
        setCurrentUser(result.user); setPage('learn');
      }, 400);
    }
  };

  const handleVerify = () => {
    const entered = digits.join('');
    if (entered.length < 6) return setErr('Please enter all 6 digits');
    if (entered !== verifyCode) return setErr('Incorrect code — check your email and try again');
    setErr(''); setLoading(true);
    setTimeout(() => {
      const result = authSignup(form.username.trim(), form.email.trim().toLowerCase(), form.password);
      setLoading(false);
      if (result.error) { setErr(result.error); return; }
      setCurrentUser(result.user); setPage('learn');
    }, 500);
  };

  // ── Verify screen ──
  if (step === 'verify') {
    return (
      <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'40px 20px' }} className="grid-bg">
        <div style={{ background:'#111216', border:'1px solid #1e2028', borderRadius:'16px', padding:'40px', width:'100%', maxWidth:'420px' }}>
          <div style={{ textAlign:'center', marginBottom:'28px' }}>
            <div style={{ fontSize:'52px', marginBottom:'14px' }}>📧</div>
            <div className="oxanium" style={{ fontSize:'24px', fontWeight:'800', marginBottom:'8px' }}>Check your email</div>
            <div style={{ color:'#888', fontSize:'14px', lineHeight:1.7 }}>
              We sent a 6-digit verification code to<br/>
              <span style={{ color:'#00D4FF', fontWeight:'600' }}>{form.email}</span>
            </div>
          </div>

          {/* Demo mode — show code */}
          <div style={{ background:'rgba(0,212,255,0.04)', border:'1px solid rgba(0,212,255,0.15)', borderRadius:'10px', padding:'12px 16px', marginBottom:'24px', textAlign:'center' }}>
            <div style={{ fontSize:'11px', color:'#4b5563', marginBottom:'6px' }}>Demo mode — your verification code:</div>
            <div className="oxanium" style={{ fontSize:'30px', fontWeight:'900', color:'#00D4FF', letterSpacing:'8px' }}>{verifyCode}</div>
          </div>

          {/* 6-box OTP input */}
          <div style={{ display:'flex', gap:'8px', justifyContent:'center', marginBottom:'24px' }}>
            {digits.map((d,i) => (
              <input key={i} ref={digitRefs[i]} className="otp-box" type="text" inputMode="numeric" maxLength={1} value={d}
                onChange={e => handleDigit(i, e.target.value)}
                onKeyDown={e => handleDigitKey(i, e)}
                onPaste={i===0 ? e => {
                  const txt = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
                  if (txt.length === 6) { setDigits(txt.split('')); digitRefs[5].current?.focus(); e.preventDefault(); }
                } : undefined}
                style={{ border:`2px solid ${d ? '#00D4FF' : '#2a2d35'}` }}
              />
            ))}
          </div>

          {err && <div style={{ background:'rgba(239,68,68,0.1)', border:'1px solid rgba(239,68,68,0.3)', borderRadius:'8px', padding:'10px 14px', marginBottom:'16px', color:'#ef4444', fontSize:'13px' }}>⚠ {err}</div>}

          <button className="btn-primary" style={{ width:'100%', fontSize:'16px', padding:'14px', marginBottom:'12px', opacity:loading?0.7:1 }} onClick={handleVerify} disabled={loading}>
            {loading ? 'Creating account…' : '✓ Verify & Create Account'}
          </button>
          <div style={{ textAlign:'center' }}>
            <button onClick={()=>{setStep('form');setDigits(['','','','','','']);setErr('');}} style={{ color:'#6b7280', background:'none', border:'none', cursor:'pointer', fontSize:'13px' }}>
              ← Back to sign up
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ── Main form ──
  return (
    <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'40px 20px' }} className="grid-bg">
      <div style={{ background:'#111216', border:'1px solid #1e2028', borderRadius:'16px', padding:'40px', width:'100%', maxWidth:'400px' }}>
        <div style={{ textAlign:'center', marginBottom:'32px' }}>
          <div className="oxanium" style={{ fontSize:'28px', fontWeight:'800', marginBottom:'4px' }}>
            <span style={{ color:'#00D4FF' }}>Studio</span>Dex
          </div>
          <div style={{ color:'#888', fontSize:'15px' }}>{mode==='login'?'Welcome back!':'Create your free account'}</div>
        </div>

        <div style={{ display:'flex', flexDirection:'column', gap:'12px', marginBottom:'24px' }}>
          {mode==='signup' && (
            <input type="text" placeholder="Username" value={form.username} onChange={e=>setForm(f=>({...f,username:e.target.value}))} />
          )}
          <input type="email" placeholder="Email address" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} />
          <input type="password" placeholder="Password (min 6 characters)" value={form.password}
            onChange={e=>setForm(f=>({...f,password:e.target.value}))}
            onKeyDown={e=>e.key==='Enter'&&handleSubmit()} />
        </div>

        {err && <div style={{ background:'rgba(239,68,68,0.1)', border:'1px solid rgba(239,68,68,0.3)', borderRadius:'8px', padding:'10px 14px', marginBottom:'16px', color:'#ef4444', fontSize:'13px' }}>⚠ {err}</div>}

        <button className="btn-primary pulse-glow" style={{ width:'100%', fontSize:'16px', padding:'14px', marginBottom:'16px', opacity:loading?0.7:1 }} onClick={handleSubmit} disabled={loading}>
          {loading ? '…' : mode==='login' ? 'Log In' : 'Continue →'}
        </button>

        <div style={{ textAlign:'center', fontSize:'14px', color:'#888' }}>
          {mode==='login'
            ? <>Don't have an account? <button onClick={()=>setPage('signup')} style={{ color:'#00D4FF', background:'none', border:'none', cursor:'pointer' }}>Sign up free</button></>
            : <>Already have an account? <button onClick={()=>setPage('login')} style={{ color:'#00D4FF', background:'none', border:'none', cursor:'pointer' }}>Log in</button></>}
        </div>
      </div>
    </div>
  );
}

// ─── STREAK CALENDAR ─────────────────────────────────────────────────────────
function StreakCalendar() {
  const { currentUser } = useAuth();
  const [today] = useState(() => new Date());
  const [viewDate, setViewDate] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));
  const [timeLeft, setTimeLeft] = useState('00:00:00');

  useEffect(() => {
    const tick = () => {
      const now = new Date();
      const midnight = new Date(now); midnight.setHours(24,0,0,0);
      const diff = midnight - now;
      const h = String(Math.floor(diff/3600000)).padStart(2,'0');
      const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
      const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
      setTimeLeft(`${h}:${m}:${s}`);
    };
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, []);

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstDow = new Date(year, month, 1).getDay();
  const monthLabel = viewDate.toLocaleString('default',{month:'long'});
  const isCurrentMonth = month===today.getMonth() && year===today.getFullYear();
  const streak = currentUser?.streak ?? 2;

  const streakDays = new Set();
  if (isCurrentMonth) {
    for (let i=0; i<streak && i<today.getDate(); i++) streakDays.add(today.getDate()-i);
  }

  const firstDowCurMonth = new Date(today.getFullYear(), today.getMonth(), 1).getDay();
  const currentWeek = Math.ceil((today.getDate() + firstDowCurMonth) / 7);
  const maxWeeks = Math.ceil((daysInMonth + firstDow) / 7);

  return (
    <div style={{ width:'265px', flexShrink:0, background:'#0c0e13', borderLeft:'1px solid #1e2028', display:'flex', flexDirection:'column', overflowY:'auto' }}>

      {/* ── Hex badge + day/timer ── */}
      <div style={{ padding:'20px 16px 16px', borderBottom:'1px solid #1e2028', textAlign:'center' }}>
        <div style={{ display:'flex', justifyContent:'center', marginBottom:'12px' }}>
          <div style={{
            width:'70px', height:'80px',
            background:'linear-gradient(160deg, #c8960c 0%, #7b5800 60%, #4a3500 100%)',
            clipPath:'polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)',
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'1px',
            boxShadow:'0 0 20px rgba(200,150,12,0.25)',
          }}>
            <span style={{ fontSize:'26px', fontWeight:'900', color:'#fff', lineHeight:1, fontFamily:"'Oxanium',sans-serif" }}>{today.getDate()}</span>
            <span style={{ fontSize:'9px', color:'#f0d060', fontWeight:'700', letterSpacing:'1.5px' }}>{today.toLocaleString('default',{month:'short'}).toUpperCase()}</span>
          </div>
        </div>
        <div style={{ fontSize:'14px', fontWeight:'700', color:'#e5e7eb' }}>Day {streak}</div>
        <div style={{ fontSize:'11px', color:'#6b7280', marginTop:'3px', fontFamily:"'Fira Code',monospace" }}>{timeLeft} left</div>
      </div>

      {/* ── Calendar ── */}
      <div style={{ padding:'12px 14px', borderBottom:'1px solid #1e2028' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'10px' }}>
          <button onClick={()=>setViewDate(new Date(year,month-1,1))} style={{ background:'none', border:'none', color:'#6b7280', cursor:'pointer', fontSize:'20px', lineHeight:1, padding:'0 6px', transition:'color 0.1s' }}
            onMouseOver={e=>e.currentTarget.style.color='#ccc'} onMouseOut={e=>e.currentTarget.style.color='#6b7280'}>‹</button>
          <span style={{ fontSize:'11px', fontWeight:'700', color:'#9ca3af', letterSpacing:'1px' }}>{monthLabel.toUpperCase()} {year}</span>
          <button onClick={()=>setViewDate(new Date(year,month+1,1))} style={{ background:'none', border:'none', color:'#6b7280', cursor:'pointer', fontSize:'20px', lineHeight:1, padding:'0 6px', transition:'color 0.1s' }}
            onMouseOver={e=>e.currentTarget.style.color='#ccc'} onMouseOut={e=>e.currentTarget.style.color='#6b7280'}>›</button>
        </div>

        {/* Day-of-week headers */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', marginBottom:'4px' }}>
          {['S','M','T','W','T','F','S'].map((d,i)=>(
            <div key={i} style={{ textAlign:'center', fontSize:'10px', color:'#374151', fontWeight:'700' }}>{d}</div>
          ))}
        </div>

        {/* Day cells */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', rowGap:'2px' }}>
          {Array.from({length:firstDow}).map((_,i)=><div key={`e${i}`}/>)}
          {Array.from({length:daysInMonth},(_,i)=>i+1).map(d => {
            const isToday    = isCurrentMonth && d === today.getDate();
            const inStreak   = streakDays.has(d);
            const isFuture   = isCurrentMonth && d > today.getDate();
            return (
              <div key={d} style={{
                textAlign:'center', margin:'1px auto',
                width:'28px', height:'28px', borderRadius:'50%',
                display:'flex', alignItems:'center', justifyContent:'center',
                background: isToday ? '#16a34a' : inStreak ? 'rgba(22,163,74,0.22)' : 'transparent',
                color: isToday ? '#fff' : inStreak ? '#4ade80' : isFuture ? '#1f2937' : '#6b7280',
                fontSize:'12px', fontWeight: isToday ? '800' : '400',
              }}>{d}</div>
            );
          })}
        </div>
      </div>

      {/* ── Weekly Premium ── */}
      <div style={{ padding:'12px 14px', borderBottom:'1px solid #1e2028' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px' }}>
          <span style={{ fontSize:'12px', fontWeight:'700', color:'#ffa116', display:'flex', alignItems:'center', gap:'5px' }}>
            Weekly Premium
            <span style={{ width:'14px', height:'14px', borderRadius:'50%', border:'1px solid #ffa116', display:'inline-flex', alignItems:'center', justifyContent:'center', fontSize:'10px', color:'#ffa116', flexShrink:0 }}>?</span>
          </span>
          <span style={{ fontSize:'11px', color:'#6b7280' }}>5 days left</span>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(5,1fr)', gap:'4px' }}>
          {[1,2,3,4,5].map(w => {
            const isActive = isCurrentMonth && w === currentWeek;
            const isPast   = isCurrentMonth && w < currentWeek;
            return (
              <div key={w} style={{
                textAlign:'center', padding:'6px 0', borderRadius:'6px', cursor:'pointer',
                background: isActive ? 'rgba(255,161,22,0.14)' : 'transparent',
                border:`1px solid ${isActive ? '#ffa116' : '#1e2028'}`,
                color: isActive ? '#ffa116' : isPast ? '#374151' : '#1f2937',
                fontSize:'11px', fontWeight:'700', fontFamily:"'Rajdhani',sans-serif",
                transition:'all 0.15s',
              }}>W{w}</div>
            );
          })}
        </div>
      </div>

      {/* ── Redeem ── */}
      <div style={{ padding:'11px 14px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
          <span style={{ fontSize:'18px' }}>💎</span>
          <span style={{ fontSize:'14px', fontWeight:'700', color:'#9ca3af' }}>0</span>
          <button style={{ background:'none', border:'none', color:'#00D4FF', fontSize:'13px', cursor:'pointer', fontWeight:'600', fontFamily:"'Rajdhani',sans-serif", padding:0 }}>Redeem</button>
        </div>
        <button style={{ background:'none', border:'none', color:'#4b5563', fontSize:'12px', cursor:'pointer' }}>Rules</button>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState('landing');
  const [currentUser, setCurrentUser] = useState(() => _getMe());
  const [avatarUrl, setAvatarUrl] = useState(() => localStorage.getItem('studiodex_avatar') || null);
  const [selectedLesson, setSelectedLesson] = useState(null);
  const [selectedChallenge, setSelectedChallenge] = useState(null);
  const [showUpgrade, setShowUpgrade] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(true);

  const refreshUser = (u) => { setCurrentUser(u); };
  const authLogout = () => { _clearMe(); setCurrentUser(null); setPage('landing'); };

  const auth = { currentUser, setCurrentUser, authLogout, refreshUser };

  const noSidebarPages = ['landing','login','signup'];
  const showSidebar = !noSidebarPages.includes(page);

  const navItems = [
    { id:'challenges', label:'Challenges', icon:Icons.zap },
    { id:'playground', label:'Playground', icon:Icons.terminal },
    { id:'reference', label:'API Reference', icon:Icons.search },
    { id:'profile', label:'Profile', icon:Icons.user },
    { id:'leaderboard', label:'Leaderboard', icon:Icons.trophy },
    { id:'pricing', label:'Pricing', icon:Icons.dollar },
  ];

  const renderPage = () => {
    switch(page) {
      case 'landing': return <LandingPage setPage={setPage} />;
      case 'login': return <AuthPage mode="login" setPage={setPage} />;
      case 'signup': return <AuthPage mode="signup" setPage={setPage} />;
      case 'learn': return <LearnPage setPage={setPage} setSelectedLesson={setSelectedLesson} />;
      case 'lesson': return <LessonPage lesson={selectedLesson} setPage={setPage} setShowUpgrade={setShowUpgrade} />;
      case 'challenges': return <ChallengesPage setPage={setPage} setSelectedChallenge={setSelectedChallenge} />;
      case 'challenge': return <ChallengePage challenge={selectedChallenge} setPage={setPage} />;
      case 'playground': return <PlaygroundPage />;
      case 'reference': return <ReferencePage />;
      case 'profile': return <ProfilePage setShowUpgrade={setShowUpgrade} setPage={setPage} avatarUrl={avatarUrl} setAvatarUrl={setAvatarUrl} />;
      case 'leaderboard': return <LeaderboardPage />;
      case 'pricing': return <PricingPage setShowUpgrade={setShowUpgrade} />;
      default: return <LandingPage setPage={setPage} />;
    }
  };

  if (!showSidebar) {
    return (
      <AuthContext.Provider value={auth}>
        <div>
          <div style={{ position:'fixed', top:0, left:0, right:0, height:'60px', background:'rgba(13,15,20,0.95)', borderBottom:'1px solid #1e2028', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 32px', zIndex:50, backdropFilter:'blur(10px)' }}>
            <div className="oxanium" style={{ fontSize:'22px', fontWeight:'800', cursor:'pointer' }} onClick={()=>setPage('landing')}>
              <span style={{ color:'#00D4FF' }}>Studio</span>Dex
            </div>
            <div style={{ display:'flex', gap:'12px' }}>
              {currentUser
                ? <button className="btn-primary" style={{ padding:'7px 20px', fontSize:'14px' }} onClick={()=>setPage('learn')}>Dashboard</button>
                : <>
                    <button className="btn-outline" style={{ padding:'7px 20px', fontSize:'14px' }} onClick={()=>setPage('login')}>Log In</button>
                    <button className="btn-primary" style={{ padding:'7px 20px', fontSize:'14px' }} onClick={()=>setPage('signup')}>Sign Up Free</button>
                  </>
              }
            </div>
          </div>
          <div style={{ paddingTop:'60px' }}>{renderPage()}</div>
          {showUpgrade && <UpgradeModal onClose={()=>setShowUpgrade(false)} />}
        </div>
      </AuthContext.Provider>
    );
  }

  const xp = currentUser?.xp ?? 1250;
  const level = currentUser?.level ?? 12;
  const streak = currentUser?.streak ?? 2;
  const username = currentUser?.username ?? 'Dev';
  const isPro = currentUser?.isPro ?? false;

  return (
    <AuthContext.Provider value={auth}>
      <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
        {/* Sidebar */}
        <div style={{ width: sidebarOpen?'220px':'60px', background:'#080a0e', borderRight:'1px solid #1e2028', display:'flex', flexDirection:'column', flexShrink:0, transition:'width 0.2s', overflow:'hidden' }}>
          <div style={{ padding:'16px 12px', borderBottom:'1px solid #1e2028', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            {sidebarOpen && <div className="oxanium" style={{ fontSize:'18px', fontWeight:'800', cursor:'pointer' }} onClick={()=>setPage('landing')}><span style={{ color:'#00D4FF' }}>Studio</span>Dex</div>}
            <button onClick={()=>setSidebarOpen(o=>!o)} style={{ background:'none', border:'none', color:'#888', cursor:'pointer', padding:'4px', flexShrink:0 }}>
              <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
          </div>

          {sidebarOpen && (
            <div style={{ padding:'12px', borderBottom:'1px solid #1e2028' }}>
              <div style={{ display:'flex', justifyContent:'space-between', fontSize:'11px', color:'#888', marginBottom:'4px' }}>
                <span>Lv.{level} {username}</span>
                <span>🔥 {streak}</span>
              </div>
              <div style={{ background:'#1e2028', borderRadius:'999px', height:'5px' }}>
                <div className="xp-bar" style={{ width:`${Math.min((xp/(level*200))*100,100)}%`, height:'5px' }} />
              </div>
            </div>
          )}

          <nav style={{ flex:1, padding:'8px', display:'flex', flexDirection:'column', gap:'4px', overflowY:'auto' }}>
            {navItems.map(item => (
              <div key={item.id} className={`nav-item ${page===item.id?'active':''}`}
                onClick={() => setPage(item.id)}
                style={{ display:'flex', alignItems:'center', gap:'12px', padding:'10px 12px', borderRadius:'8px', cursor:'pointer', whiteSpace:'nowrap' }}>
                <span style={{ flexShrink:0 }}>{item.icon}</span>
                {sidebarOpen && <span style={{ fontSize:'14px', fontWeight:'600' }}>{item.label}</span>}
              </div>
            ))}
          </nav>

          {sidebarOpen && !isPro && (
            <div style={{ padding:'12px', borderTop:'1px solid #1e2028' }}>
              <button onClick={()=>setShowUpgrade(true)} className="btn-primary pulse-glow" style={{ width:'100%', fontSize:'13px', padding:'10px' }}>
                ⚡ Go Pro
              </button>
            </div>
          )}
          {sidebarOpen && isPro && (
            <div style={{ padding:'12px', borderTop:'1px solid #1e2028', textAlign:'center' }}>
              <span className="badge badge-pro" style={{ fontSize:'12px' }}>⚡ PRO MEMBER</span>
            </div>
          )}
        </div>

        {/* Main Content */}
        <div style={{ flex:1, overflow:'auto', display:'flex', flexDirection:'column' }}>
          <div style={{ height:'52px', background:'rgba(8,10,14,0.95)', borderBottom:'1px solid #1e2028', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 24px', flexShrink:0, backdropFilter:'blur(10px)' }}>
            <div style={{ fontSize:'14px', color:'#888' }}>
              {navItems.find(n=>n.id===page)?.label || 'StudioDex'}
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:'16px' }}>
              {currentUser && <span style={{ fontSize:'13px', color:'#eab308' }}>🔥 {streak}-day streak</span>}
              {currentUser && <span style={{ fontSize:'13px', color:'#00D4FF', fontWeight:'700' }}>⭐ {xp} XP</span>}
              <div style={{ display:'flex', alignItems:'center', gap:'8px', cursor:'pointer' }} onClick={()=>setPage('profile')}>
                <div style={{ width:'32px', height:'32px', borderRadius:'50%', background:'linear-gradient(135deg, #00D4FF, #0099cc)', display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden' }}>
                  {avatarUrl ? <img src={avatarUrl} alt="avatar" style={{ width:'100%', height:'100%', objectFit:'cover' }} /> : '🧑‍💻'}
                </div>
                {isPro && <span className="badge badge-pro" style={{ fontSize:'10px' }}>PRO</span>}
              </div>
            </div>
          </div>
          <div style={{ flex:1, overflow:'auto', display:'flex', minHeight:0 }}>
            <div key={page} className="page-enter" style={{ flex:1, overflow:'auto', minWidth:0 }}>
              {renderPage()}
            </div>
            {!['challenge','lesson'].includes(page) && <StreakCalendar />}
          </div>
        </div>

        {showUpgrade && <UpgradeModal onClose={()=>setShowUpgrade(false)} />}
      </div>
    </AuthContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
