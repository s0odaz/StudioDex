const LESSONS = [
  { id:1, title:"Introduction to BasePart Properties", category:"Classes", difficulty:"Beginner", xp:50, time:"8 min", locked:false, completed:true, description:"Learn the foundational properties of BasePart: Size, Position, Color, Material, Anchored, and CanCollide.", code:`-- BasePart Properties Example\nlocal part = workspace.MyPart\n\n-- Position the part\npart.Position = Vector3.new(0, 10, 0)\n\n-- Set size\npart.Size = Vector3.new(4, 1, 4)\n\n-- Visual properties\npart.Color = Color3.fromRGB(255, 100, 0)\npart.Material = Enum.Material.SmoothPlastic\n\n-- Physics\npart.Anchored = true\npart.CanCollide = true\n\nprint("Part configured!")` },
  { id:2, title:"Moving Parts with CFrame", category:"Data Types", difficulty:"Intermediate", xp:75, time:"12 min", locked:false, completed:true, description:"Master CFrame for positioning, rotating, and orienting objects in 3D space.", code:`-- CFrame Examples\nlocal part = workspace.Part\n\n-- Simple position\npart.CFrame = CFrame.new(0, 5, 0)\n\n-- Position + rotation\npart.CFrame = CFrame.new(0, 5, 0) \n  * CFrame.Angles(0, math.rad(45), 0)\n\n-- Smooth lerp movement\nlocal target = CFrame.new(10, 5, 10)\nfor i = 0, 1, 0.05 do\n  part.CFrame = part.CFrame:Lerp(target, i)\n  task.wait(0.05)\nend\nprint("Moved!")` },
  { id:3, title:"Detecting Collisions with .Touched", category:"Events", difficulty:"Beginner", xp:50, time:"6 min", locked:false, completed:false, description:"Use the Touched event to detect when parts collide and respond with game logic.", code:`-- Touched Event Example\nlocal part = workspace.KillBrick\nlocal debounce = false\n\npart.Touched:Connect(function(hit)\n  if debounce then return end\n  \n  local humanoid = hit.Parent:FindFirstChild("Humanoid")\n  if humanoid then\n    debounce = true\n    humanoid.Health = 0\n    print("Player eliminated!")\n    task.wait(1)\n    debounce = false\n  end\nend)` },
  { id:4, title:"Animating with TweenService", category:"Classes", difficulty:"Intermediate", xp:100, time:"15 min", locked:false, completed:false, description:"Create smooth animations for parts, UI, and more using TweenService.", code:`-- TweenService Animation\nlocal TweenService = game:GetService("TweenService")\nlocal part = workspace.Part\n\nlocal info = TweenInfo.new(\n  1.5,                      -- duration\n  Enum.EasingStyle.Bounce,  -- style\n  Enum.EasingDirection.Out  -- direction\n)\n\nlocal tween = TweenService:Create(part, info, {\n  Position = Vector3.new(0, 20, 0),\n  Color = Color3.fromRGB(0, 212, 255)\n})\n\ntween:Play()\ntween.Completed:Connect(function()\n  print("Animation complete!")\nend)` },
  { id:5, title:"Remote Events for Client-Server", category:"Events", difficulty:"Advanced", xp:150, time:"20 min", locked:false, completed:false, description:"Master the client-server boundary using RemoteEvents and RemoteFunctions.", code:`-- SERVER SCRIPT\nlocal remote = game.ReplicatedStorage.MyEvent\n\nremote.OnServerEvent:Connect(function(player, damage)\n  local char = player.Character\n  local hum = char and char:FindFirstChild("Humanoid")\n  if hum then\n    hum.Health -= damage\n  end\n  print(player.Name, "dealt", damage, "damage")\nend)\n\n-- LOCAL SCRIPT\nlocal remote = game.ReplicatedStorage.MyEvent\nlocal UIS = game:GetService("UserInputService")\n\nUIS.InputBegan:Connect(function(input)\n  if input.KeyCode == Enum.KeyCode.E then\n    remote:FireServer(25) -- deal 25 damage\n  end\nend)` },
  { id:6, title:"Using pcall() for Error Handling", category:"Global Functions", difficulty:"Intermediate", xp:75, time:"10 min", locked:true, completed:false, description:"Write robust scripts that gracefully handle runtime errors using pcall and xpcall.", code:`-- Safe error handling with pcall\nlocal function riskyOperation()\n  local data = game:GetService("DataStoreService")\n    :GetDataStore("PlayerData")\n    :GetAsync("player_123")\n  return data\nend\n\nlocal success, result = pcall(riskyOperation)\n\nif success then\n  print("Data loaded:", result)\nelse\n  warn("Failed to load data:", result)\n  -- fallback logic here\nend\n\n-- xpcall with error handler\nlocal ok, err = xpcall(riskyOperation, function(e)\n  return "Caught: " .. tostring(e)\nend)\nprint(ok, err)` },
  { id:7, title:"Color3 and BrickColor Explained", category:"Data Types", difficulty:"Beginner", xp:50, time:"8 min", locked:true, completed:false, description:"Understand the difference between Color3 and BrickColor and how to use them effectively.", code:`-- Color3 Methods\nlocal c1 = Color3.new(1, 0, 0)           -- Red (0-1 range)\nlocal c2 = Color3.fromRGB(255, 165, 0)    -- Orange\nlocal c3 = Color3.fromHSV(0.6, 1, 1)     -- Blue via HSV\n\n-- BrickColor (legacy)\nlocal bc = BrickColor.new("Bright red")\nlocal bc2 = BrickColor.Random()\n\n-- Convert BrickColor → Color3\nlocal asColor3 = bc.Color\n\n-- Lerp between colors\nlocal lerped = c1:Lerp(c2, 0.5)\nprint("Lerped:", lerped)` },
  { id:8, title:"Enum.KeyCode: Keyboard Input", category:"Enumerations", difficulty:"Beginner", xp:50, time:"7 min", locked:true, completed:false, description:"Use Enum.KeyCode with UserInputService to detect and respond to keyboard input.", code:`-- Keyboard Input with UserInputService\nlocal UIS = game:GetService("UserInputService")\n\nUIS.InputBegan:Connect(function(input, gameProcessed)\n  if gameProcessed then return end\n  \n  if input.KeyCode == Enum.KeyCode.Space then\n    print("Space pressed!")\n  elseif input.KeyCode == Enum.KeyCode.F then\n    print("F pressed - toggling flashlight")\n  end\nend)\n\n-- Check if key is held\ngame:GetService("RunService").Heartbeat:Connect(function()\n  if UIS:IsKeyDown(Enum.KeyCode.W) then\n    print("Moving forward...")\n  end\nend)` },
  { id:9, title:"table Library Mastery", category:"Libraries", difficulty:"Advanced", xp:125, time:"18 min", locked:true, completed:false, description:"Deep dive into Luau's table library: sort, move, freeze, clone, and more.", code:`-- table library examples\nlocal players = {"Alice","Bob","Charlie","Dave"}\n\n-- Sort alphabetically\ntable.sort(players)\n\n-- Sort by custom condition\nlocal scores = {name="Alice",xp=1200}\ntable.sort(scores, function(a,b) return a.xp > b.xp end)\n\n-- find\nlocal idx = table.find(players, "Bob")\nprint("Bob is at index:", idx)\n\n-- freeze (immutable)\nlocal config = table.freeze({maxHealth=100, speed=16})\n-- config.speed = 20 -- would error!\n\n-- clone\nlocal copy = table.clone(players)\ntable.insert(copy, "Eve")\nprint(#players, #copy) -- 4, 5` },
  { id:10, title:"task Library & Async Patterns", category:"Libraries", difficulty:"Intermediate", xp:100, time:"14 min", locked:true, completed:false, description:"Modern async patterns using task.spawn, task.defer, task.delay and task.cancel.", code:`-- task library - modern threading\n\n-- task.spawn: immediate new thread\ntask.spawn(function()\n  print("Runs immediately in new thread")\n  task.wait(2)\n  print("Done after 2 seconds")\nend)\nprint("This runs before the wait!")\n\n-- task.defer: next frame\ntask.defer(function()\n  print("Deferred to next frame")\nend)\n\n-- task.delay: run after N seconds\nlocal thread = task.delay(5, function()\n  print("5 seconds later!")\nend)\n\n-- Cancel a pending task\ntask.cancel(thread)\nprint("Task cancelled!")` },
  { id:11, title:"Humanoid & Character Control", category:"Classes", difficulty:"Intermediate", xp:100, time:"16 min", locked:true, completed:false, description:"Control player characters using the Humanoid class: health, movement, states.", code:`-- Humanoid Control\nlocal Players = game:GetService("Players")\n\nPlayers.PlayerAdded:Connect(function(player)\n  player.CharacterAdded:Connect(function(char)\n    local hum = char:WaitForChild("Humanoid")\n    \n    -- Modify stats\n    hum.MaxHealth = 200\n    hum.Health = 200\n    hum.WalkSpeed = 24\n    hum.JumpPower = 60\n    \n    -- Listen to state changes\n    hum.StateChanged:Connect(function(old, new)\n      if new == Enum.HumanoidStateType.Freefall then\n        print(player.Name, "is falling!")\n      end\n    end)\n  end)\nend)` },
  { id:12, title:"DataStore: Saving Player Data", category:"Classes", difficulty:"Advanced", xp:200, time:"25 min", locked:true, completed:false, description:"Persist player data across sessions using DataStoreService with proper error handling.", code:`-- DataStoreService Pattern\nlocal DSS = game:GetService("DataStoreService")\nlocal Players = game:GetService("Players")\nlocal store = DSS:GetDataStore("PlayerData_v1")\n\nlocal function loadData(player)\n  local ok, data = pcall(function()\n    return store:GetAsync(player.UserId)\n  end)\n  return ok and data or { coins=0, level=1, xp=0 }\nend\n\nlocal function saveData(player, data)\n  local ok, err = pcall(function()\n    store:SetAsync(player.UserId, data)\n  end)\n  if not ok then warn("Save failed:", err) end\nend\n\nPlayers.PlayerRemoving:Connect(function(p)\n  saveData(p, { coins=500, level=5, xp=1200 })\nend)` },
  { id:13, title:"math Library: Advanced Functions", category:"Libraries", difficulty:"Intermediate", xp:75, time:"11 min", locked:true, completed:false, description:"Leverage Luau's math library for game logic: noise, clamp, lerp patterns, trig.", code:`-- Advanced math patterns\n\n-- Clamping a value\nlocal health = math.clamp(currentHP, 0, 100)\n\n-- Manual lerp (math.lerp doesn't exist in Luau)\nlocal function lerp(a, b, t)\n  return a + (b - a) * t\nend\n\n-- Perlin noise for terrain\nfor x = 0, 10 do\n  for z = 0, 10 do\n    local height = math.noise(x * 0.1, z * 0.1) * 20\n    print(x, z, height)\n  end\nend\n\n-- Trigonometry for circular motion\nlocal radius = 10\nlocal angle = 0\ngame:GetService("RunService").Heartbeat:Connect(function(dt)\n  angle += dt\n  local x = math.cos(angle) * radius\n  local z = math.sin(angle) * radius\n  part.Position = Vector3.new(x, 5, z)\nend)` },
  { id:14, title:"ScreenGui & Frame Layout", category:"Classes", difficulty:"Beginner", xp:50, time:"9 min", locked:true, completed:false, description:"Build responsive UI layouts using ScreenGui, Frame, UIListLayout, and UIPadding.", code:`-- UI Building in LocalScript\nlocal player = game.Players.LocalPlayer\nlocal gui = Instance.new("ScreenGui")\ngui.ResetOnSpawn = false\ngui.Parent = player.PlayerGui\n\nlocal frame = Instance.new("Frame")\nframe.Size = UDim2.new(0, 300, 0, 200)\nframe.Position = UDim2.new(0.5, -150, 0.5, -100)\nframe.BackgroundColor3 = Color3.fromRGB(20, 22, 28)\nframe.Parent = gui\n\n-- Rounded corners\nlocal corner = Instance.new("UICorner")\ncorner.CornerRadius = UDim.new(0, 12)\ncorner.Parent = frame\n\n-- Layout\nlocal layout = Instance.new("UIListLayout")\nlayout.Padding = UDim.new(0, 8)\nlayout.Parent = frame\n\nprint("UI created!")` },
  { id:15, title:"string Library & Pattern Matching", category:"Libraries", difficulty:"Advanced", xp:125, time:"16 min", locked:true, completed:false, description:"Master Luau string patterns for parsing, validation, and text manipulation.", code:`-- String Library Patterns\n\n-- Basic operations\nlocal s = "Hello, Roblox World!"\nprint(string.upper(s))  -- HELLO, ROBLOX WORLD!\nprint(string.len(s))    -- 21\nprint(#s)               -- 21 (same)\n\n-- Pattern matching\nlocal username = "Player_123"\nlocal name, num = string.match(username, "(%a+)_(%d+)")\nprint(name, num)  -- Player  123\n\n-- Find all numbers\nfor num in string.gmatch("Coins: 50, XP: 1200", "%d+") do\n  print("Found number:", num)\nend\n\n-- Replace\nlocal clean = string.gsub("Hello <b>World</b>", "<.->", "")\nprint(clean)  -- Hello World\n\n-- Format\nprint(string.format("%.1f%%", 87.5678)) -- 87.6%` },
];

const CHALLENGES = [
  { id:1, title:"Teleport a Player on Touch", difficulty:"Beginner", tags:["Events","BasePart"], xp:100, completed:true, description:"Create a teleport pad that moves the player to a specific location when touched. Use the Touched event and Character to find the HumanoidRootPart.", starter:`-- Challenge: Teleport Pad\nlocal pad = workspace.TeleportPad\nlocal destination = Vector3.new(0, 50, 0)\n\npad.Touched:Connect(function(hit)\n  -- TODO: Check if hit is a player character\n  -- TODO: Teleport the player's HumanoidRootPart\n  -- TODO: Add a debounce to prevent spam\nend)\n\nprint("Teleport pad ready!")`, solution:`local pad = workspace.TeleportPad\nlocal destination = Vector3.new(0, 50, 0)\nlocal debounce = {}\n\npad.Touched:Connect(function(hit)\n  local char = hit.Parent\n  local hum = char:FindFirstChild("Humanoid")\n  local hrp = char:FindFirstChild("HumanoidRootPart")\n  if not hum or not hrp then return end\n  if debounce[char] then return end\n  debounce[char] = true\n  hrp.CFrame = CFrame.new(destination)\n  task.wait(2)\n  debounce[char] = nil\nend)` },
  { id:2, title:"Animate a Door with TweenService", difficulty:"Intermediate", tags:["TweenService","CFrame"], xp:150, completed:false, description:"Build a door that smoothly opens when a player approaches using TweenService and CFrame.", starter:`-- Challenge: Animated Door\nlocal TweenService = game:GetService("TweenService")\nlocal door = workspace.Door\nlocal trigger = workspace.DoorTrigger\n\nlocal openCFrame = -- TODO: Define where the door opens to\nlocal closedCFrame = door.CFrame\n\n-- TODO: Create tween info\n-- TODO: Connect trigger.Touched to open the door\n-- TODO: Connect trigger.TouchEnded to close it\nprint("Door system ready!")`, solution:`local TS = game:GetService("TweenService")\nlocal door = workspace.Door\nlocal trigger = workspace.DoorTrigger\nlocal info = TweenInfo.new(0.5, Enum.EasingStyle.Quad, Enum.EasingDirection.Out)\nlocal closed = door.CFrame\nlocal opened = closed * CFrame.new(0, 10, 0)\nlocal playing = false\ntrigger.Touched:Connect(function()\n  if not playing then\n    playing = true\n    TS:Create(door, info, {CFrame = opened}):Play()\n  end\nend)\ntrigger.TouchEnded:Connect(function()\n  playing = false\n  TS:Create(door, info, {CFrame = closed}):Play()\nend)` },
  { id:3, title:"Build a Countdown Timer UI", difficulty:"Intermediate", tags:["UI","string.format"], xp:150, completed:false, description:"Create a countdown timer that displays MM:SS format in a ScreenGui TextLabel.", starter:`-- Challenge: Countdown Timer\nlocal Players = game:GetService("Players")\nlocal player = Players.LocalPlayer\nlocal gui = player.PlayerGui\n\nlocal timeLeft = 120 -- 2 minutes\n\nlocal function formatTime(seconds)\n  -- TODO: Return "MM:SS" format string\nend\n\n-- TODO: Create ScreenGui, Frame, TextLabel\n-- TODO: Update the label every second using task.spawn\n-- TODO: When timer hits 0, show "TIME UP!"\nprint("Timer started!")`, solution:`local player = game.Players.LocalPlayer\nlocal screen = Instance.new("ScreenGui")\nscreen.Parent = player.PlayerGui\nlocal label = Instance.new("TextLabel")\nlabel.Size = UDim2.new(0,200,0,60)\nlabel.Position = UDim2.new(0.5,-100,0,20)\nlabel.BackgroundColor3 = Color3.fromRGB(15,15,20)\nlabel.TextColor3 = Color3.fromRGB(0,212,255)\nlabel.Font = Enum.Font.Code\nlabel.TextScaled = true\nlabel.Parent = screen\nlocal timeLeft = 120\ntask.spawn(function()\n  while timeLeft > 0 do\n    local m = math.floor(timeLeft/60)\n    local s = timeLeft % 60\n    label.Text = string.format("%02d:%02d", m, s)\n    task.wait(1)\n    timeLeft -= 1\n  end\n  label.Text = "TIME UP!"\nend)` },
  { id:4, title:"Create a Coin Collection System", difficulty:"Advanced", tags:["RemoteEvent","DataStore"], xp:250, completed:false, description:"Build a full coin collection system: spawn coins in workspace, detect collection, update a leaderboard, and save to DataStore.", starter:`-- SERVER SCRIPT\nlocal Players = game:GetService("Players")\nlocal RSt = game:GetService("ReplicatedStorage")\n\n-- TODO: Create RemoteEvent for coin collection\n-- TODO: Create leaderstats on PlayerAdded\n-- TODO: Spawn coins randomly in workspace\n-- TODO: Handle coin Touched → fire remote → update coins stat\n-- TODO: Save coins on PlayerRemoving\nprint("Coin system initializing...")`, solution:`-- Full solution too long for preview\n-- See lesson: DataStore & Remote Events` },
  { id:5, title:"Raycasting Weapon System", difficulty:"Advanced", tags:["Raycasting","Physics"], xp:300, completed:false, description:"Implement a hitscan weapon using workspace:Raycast() that fires from the camera and deals damage on hit.", starter:`-- LOCAL SCRIPT: Weapon\nlocal Players = game:GetService("Players")\nlocal UIS = game:GetService("UserInputService")\nlocal RunService = game:GetService("RunService")\nlocal player = Players.LocalPlayer\nlocal camera = workspace.CurrentCamera\n\n-- TODO: On mouse click, cast a ray from camera\n-- TODO: Use RaycastParams to filter out player\n-- TODO: If hit has Humanoid, fire damage remote\n-- TODO: Show hit effect at result.Position\nprint("Weapon ready!")`, solution:`-- Raycasting hitscan\nlocal params = RaycastParams.new()\nparams.FilterDescendantsInstances = {player.Character}\nparams.FilterType = Enum.RaycastFilterType.Exclude\nUIS.InputBegan:Connect(function(input)\n  if input.UserInputType ~= Enum.UserInputType.MouseButton1 then return end\n  local origin = camera.CFrame.Position\n  local dir = camera.CFrame.LookVector * 500\n  local result = workspace:Raycast(origin, dir, params)\n  if result then\n    local hum = result.Instance.Parent:FindFirstChild("Humanoid")\n    if hum then damageRemote:FireServer(result.Instance.Parent, 25) end\n  end\nend)` },
  { id:6, title:"string.format Scoreboard", difficulty:"Beginner", tags:["string","table"], xp:75, completed:false, description:"Use string.format and table.sort to display a formatted top-5 scoreboard in the Output.", starter:`-- Challenge: Format a scoreboard\nlocal players = {\n  {name="AlphaBuilder", score=4200},\n  {name="LuaWizard99", score=8750},\n  {name="DevMaster", score=3100},\n  {name="RobloxPro", score=6400},\n  {name="ScriptKing", score=9999},\n}\n\n-- TODO: Sort by score descending\n-- TODO: Print formatted: "#1 ScriptKing     9,999 XP"\n-- TODO: Use string.format for alignment\nprint("=== SCOREBOARD ===")`, solution:`table.sort(players, function(a,b) return a.score > b.score end)\nprint("=== SCOREBOARD ===")\nfor i, p in ipairs(players) do\n  print(string.format("#%d %-15s %s XP", i, p.name, \n    tostring(p.score):reverse():gsub("(%d%d%d)", "%1,"):reverse():gsub("^,","")))\nend` },

// ─── CODE EDITOR COMPONENT ────────────────────────────────────────────────────
function CodeEditor({ value, onChange, height = "300px", readOnly = false }) {
  const lineCount = value.split('\n').length;
  return (
    <div style={{ position:'relative', fontFamily:'JetBrains Mono, monospace' }}>
      <div style={{ display:'flex', background:'#0a0c10', border:'1px solid #2a2d35', borderRadius:'8px', overflow:'hidden' }}>
        <div style={{ background:'#090b0f', padding:'16px 8px', color:'#4a4f5a', fontSize:'13px', lineHeight:'1.6', textAlign:'right', userSelect:'none', minWidth:'40px' }}>
          {Array.from({length: lineCount}, (_,i) => <div key={i}>{i+1}</div>)}
        </div>
        <textarea
          value={value}
          onChange={e => onChange && onChange(e.target.value)}
          readOnly={readOnly}
          className="code-editor"
          style={{ height, borderRadius:0, border:'none', flex:1 }}
          spellCheck={false}
        />
      </div>
    </div>
  );
}

      </div>
      {logs.length === 0 ? <div className="mono" style={{ fontSize:'12px', color:'#4a4f5a' }}>▶ Click Run to execute code</div> :
        logs.map((l,i) => (
          <div key={i} className="mono" style={{ fontSize:'12px', color: l.type==='error'?'#ef4444':l.type==='warn'?'#eab308':'#98c379', marginBottom:'2px' }}>

function simulateRun(code) {
  const logs = [];
  const fakePrint = (...args) => logs.push({ type:'log', text: args.join('\t') });
  const fakeWarn = (...args) => logs.push({ type:'warn', text: args.join('\t') });
  try {
    const prints = [];
    const lines = code.split('\n').filter(l => l.trim().startsWith('print('));
    if (lines.length === 0) logs.push({ type:'log', text:'Script executed successfully (no print output)' });
    lines.slice(0,8).forEach(line => {
      const match = line.match(/print\((.+)\)/);
      if (match) {
        let content = match[1].replace(/"/g, '').replace(/'/g, '');
        if (content.includes('..')) content = content.split('..').join(' + ');
        logs.push({ type:'log', text: content });
      }
    });
    if (code.includes('warn(')) logs.push({ type:'warn', text:'Warning triggered in script' });
    if (code.includes('error(')) logs.push({ type:'error', text:'Error: Runtime error in script' });
  } catch(e) {
    logs.push({ type:'error', text: e.message });
  }
  if (logs.length === 0) logs.push({ type:'log', text:'Script ran with no output' });
  return logs;
}

      </div>

      {/* Snippets */}
      <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
        <span style={{ fontSize:'12px', color:'#888', alignSelf:'center' }}>Snippets:</span>

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px', flex:1 }}>

    </div>
  );

      <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>

          const done = LESSONS.filter(l=>l.category===cat.name && l.completed).length;
          const total = LESSONS.filter(l=>l.category===cat.name).length;
          const pct = total ? (done/total)*100 : 0;
          return (
            <div key={cat.name} style={{ background:'#111216', border:'1px solid #1e2028', borderRadius:'8px', padding:'14px 18px' }}>
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'8px', fontSize:'14px' }}>

              <div style={{ background:'#1e2028', borderRadius:'999px', height:'6px' }}>

              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AuthPage({ mode, setPage }) {
  const [form, setForm] = useState({ email:'', password:'', username:'' });
  return (
    <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'40px 20px' }} className="grid-bg">
      <div style={{ background:'#111216', border:'1px solid #1e2028', borderRadius:'16px', padding:'40px', width:'100%', maxWidth:'400px' }}>
        <div style={{ textAlign:'center', marginBottom:'32px' }}>
          <div className="oxanium" style={{ fontSize:'28px', fontWeight:'800', marginBottom:'4px' }}>
            <span style={{ color:'#00D4FF' }}>Studio</span>Dex
          </div>
          <div style={{ color:'#888', fontSize:'15px' }}>{mode==='login'?'Welcome back!':'Create your account'}</div>
        </div>

        <div style={{ display:'flex', flexDirection:'column', gap:'12px', marginBottom:'20px' }}>
          {[['🔵 Continue with Google'],['🟠 Continue with Roblox']].map(([label])=>(
            <button key={label} style={{ width:'100%', background:'#1e2028', border:'1px solid #2a2d35', color:'#ccc', padding:'12px', borderRadius:'8px', cursor:'pointer', fontSize:'14px', fontFamily:'Rajdhani, sans-serif' }}>{label}</button>
          ))}
        </div>

        <div style={{ display:'flex', alignItems:'center', gap:'12px', marginBottom:'20px' }}>
          <div style={{ flex:1, height:'1px', background:'#2a2d35' }} />
          <span style={{ color:'#888', fontSize:'13px' }}>or</span>
          <div style={{ flex:1, height:'1px', background:'#2a2d35' }} />
        </div>

        <div style={{ display:'flex', flexDirection:'column', gap:'12px', marginBottom:'24px' }}>
          {mode==='signup' && <input type="text" placeholder="Username" value={form.username} onChange={e=>setForm(f=>({...f,username:e.target.value}))} />}
          <input type="email" placeholder="Email address" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} />
          <input type="password" placeholder="Password" value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))} />
        </div>

        <button className="btn-primary pulse-glow" style={{ width:'100%', fontSize:'16px', padding:'14px', marginBottom:'16px' }} onClick={()=>setPage('profile')}>
          {mode==='login'?'Log In':'Create Account — Free'}
        </button>

        <div style={{ textAlign:'center', fontSize:'14px', color:'#888' }}>
          {mode==='login'?<>Don't have an account? <button onClick={()=>setPage('signup')} style={{ color:'#00D4FF', background:'none', border:'none', cursor:'pointer' }}>Sign up free</button></>
          :<>Already have an account? <button onClick={()=>setPage('login')} style={{ color:'#00D4FF', background:'none', border:'none', cursor:'pointer' }}>Log in</button></>}
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('landing');
  const [selectedLesson, setSelectedLesson] = useState(null);
  const [selectedChallenge, setSelectedChallenge] = useState(null);
  const [showUpgrade, setShowUpgrade] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const noSidebarPages = ['landing','login','signup'];
  const showSidebar = !noSidebarPages.includes(page);

  const navItems = [
    { id:'learn', label:'Curriculum', icon:Icons.book },
    { id:'challenges', label:'Challenges', icon:Icons.zap },
    { id:'playground', label:'Playground', icon:Icons.terminal },
    { id:'reference', label:'API Reference', icon:Icons.search },
    { id:'profile', label:'Profile', icon:Icons.user },
    { id:'leaderboard', label:'Leaderboard', icon:Icons.trophy },
    { id:'pricing', label:'Pricing', icon:Icons.dollar },
  ];

  const renderPage = () => {
    switch(page) {
      case 'landing': return <LandingPage setPage={setPage} />;
      case 'login': return <AuthPage mode="login" setPage={setPage} />;
      case 'signup': return <AuthPage mode="signup" setPage={setPage} />;
      case 'learn': return <LearnPage setPage={setPage} setSelectedLesson={setSelectedLesson} />;
      case 'lesson': return <LessonPage lesson={selectedLesson} setPage={setPage} setShowUpgrade={setShowUpgrade} />;
      case 'challenges': return <ChallengesPage setPage={setPage} setSelectedChallenge={setSelectedChallenge} />;
      case 'challenge': return <ChallengePage challenge={selectedChallenge} setPage={setPage} />;
      case 'playground': return <PlaygroundPage />;
      case 'reference': return <ReferencePage />;
      case 'profile': return <ProfilePage />;
      case 'leaderboard': return <LeaderboardPage />;
      case 'pricing': return <PricingPage setShowUpgrade={setShowUpgrade} />;
      default: return <LandingPage setPage={setPage} />;
    }
  };

  if (!showSidebar) {
    return (
      <div>
        {/* Top Bar */}
        <div style={{ position:'fixed', top:0, left:0, right:0, height:'60px', background:'rgba(13,15,20,0.95)', borderBottom:'1px solid #1e2028', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 32px', zIndex:50, backdropFilter:'blur(10px)' }}>
          <div className="oxanium" style={{ fontSize:'22px', fontWeight:'800', cursor:'pointer' }} onClick={()=>setPage('landing')}>
            <span style={{ color:'#00D4FF' }}>Studio</span>Dex
          </div>
          <div style={{ display:'flex', gap:'12px' }}>
            <button className="btn-outline" style={{ padding:'7px 20px', fontSize:'14px' }} onClick={()=>setPage('login')}>Log In</button>
            <button className="btn-primary" style={{ padding:'7px 20px', fontSize:'14px' }} onClick={()=>setPage('signup')}>Sign Up Free</button>
          </div>
        </div>
        <div style={{ paddingTop:'60px' }}>{renderPage()}</div>
        {showUpgrade && <UpgradeModal onClose={()=>setShowUpgrade(false)} />}
      </div>
    );
  }

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      {/* Sidebar */}
      <div style={{ width: sidebarOpen?'220px':'60px', background:'#080a0e', borderRight:'1px solid #1e2028', display:'flex', flexDirection:'column', flexShrink:0, transition:'width 0.2s', overflow:'hidden' }}>
        <div style={{ padding:'16px 12px', borderBottom:'1px solid #1e2028', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          {sidebarOpen && <div className="oxanium" style={{ fontSize:'18px', fontWeight:'800', cursor:'pointer' }} onClick={()=>setPage('landing')}><span style={{ color:'#00D4FF' }}>Studio</span>Dex</div>}
          <button onClick={()=>setSidebarOpen(o=>!o)} style={{ background:'none', border:'none', color:'#888', cursor:'pointer', padding:'4px', flexShrink:0 }}>
            <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>

        {/* XP Mini */}
        {sidebarOpen && (
          <div style={{ padding:'12px', borderBottom:'1px solid #1e2028' }}>
            <div style={{ display:'flex', justifyContent:'space-between', fontSize:'11px', color:'#888', marginBottom:'4px' }}>
              <span>Lv.12 Builder</span><span>🔥 2</span>
            </div>
            <div style={{ background:'#1e2028', borderRadius:'999px', height:'5px' }}>
              <div className="xp-bar" style={{ width:'62%', height:'5px' }} />
            </div>
          </div>
        )}

        <nav style={{ flex:1, padding:'8px 8px', display:'flex', flexDirection:'column', gap:'4px', overflowY:'auto' }}>
          {navItems.map(item => (
            <div key={item.id} className={`nav-item ${page===item.id||page===item.id.slice(0,-1)?'active':''}`}
              onClick={() => setPage(item.id)}
              style={{ display:'flex', alignItems:'center', gap:'12px', padding:'10px 12px', borderRadius:'8px', cursor:'pointer', whiteSpace:'nowrap' }}>
              <span style={{ flexShrink:0 }}>{item.icon}</span>
              {sidebarOpen && <span style={{ fontSize:'14px', fontWeight:'600' }}>{item.label}</span>}
            </div>
          ))}
        </nav>

        {sidebarOpen && (
          <div style={{ padding:'12px', borderTop:'1px solid #1e2028' }}>
            <button onClick={()=>setShowUpgrade(true)} className="btn-primary pulse-glow" style={{ width:'100%', fontSize:'13px', padding:'10px' }}>
              ⚡ Go Pro
            </button>
          </div>
        )}
      </div>

      {/* Main Content */}
      <div style={{ flex:1, overflow:'auto', display:'flex', flexDirection:'column' }}>
        {/* Top Bar */}
        <div style={{ height:'52px', background:'rgba(8,10,14,0.95)', borderBottom:'1px solid #1e2028', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 24px', flexShrink:0, backdropFilter:'blur(10px)' }}>
          <div style={{ fontSize:'14px', color:'#888' }}>
            {navItems.find(n=>n.id===page)?.label || 'StudioDex'}
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:'16px' }}>
            <span style={{ fontSize:'13px', color:'#eab308' }}>🔥 2-day streak</span>
            <span style={{ fontSize:'13px', color:'#00D4FF', fontWeight:'700' }}>⭐ 1,250 XP</span>
            <div style={{ width:'32px', height:'32px', borderRadius:'50%', background:'linear-gradient(135deg, #00D4FF, #0099cc)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }} onClick={()=>setPage('profile')}>🧑‍💻</div>
          </div>
        </div>
        <div style={{ flex:1, overflow:'auto' }}>{renderPage()}</div>
      </div>

      {showUpgrade && <UpgradeModal onClose={()=>setShowUpgrade(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
